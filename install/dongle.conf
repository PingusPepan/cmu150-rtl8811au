# Settings for load-wlan1.sh. Sourced as POSIX sh, so no spaces around "=".
# Installed to /data_persist/wl/dongle.conf.

# Driver channel-plan override, passed to insmod as rtw_channel_plan.
# 0x11 = RT_CHANNEL_DOMAIN_FCC_NO_DFS: 2.4 GHz 1-11 plus 5 GHz 36-48 and 149-165, all
# non-DFS. The adapter's own efuse channel plan is 2.4 GHz only, so without this the driver's
# internal channel set has no 5 GHz channels. The software plan wins in
# hal_com_config_channel_plan. Which channels may transmit is decided separately, by the
# driver's regulatory domain: 5 GHz 36-48 only (docs/ABI-NOTES.md, section 10).
CHANNEL_PLAN=0x11
